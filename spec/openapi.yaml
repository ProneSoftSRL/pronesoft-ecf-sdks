          $ref: "#/components/responses/RateLimitError"

  /{environment}/ecf/status/{id}:
    get:
      tags: [eCF Submission]
      summary: Consultar estado del documento por ID interno
      operationId: getEcfStatus
      security:
        - oauth2: [documents:read]
      parameters:
        - $ref: "#/components/parameters/TenantIdHeaderOptional"
        - name: environment
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Environment"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Estado del documento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EcfStatusResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /{environment}/ecf/responses/stats:
    get:
      tags: [eCF Submission]
      summary: Obtener estadísticas de envíos (últimos 30 días)
      operationId: getEcfStats
      security:
        - oauth2: [documents:read]
      parameters:
        - $ref: "#/components/parameters/TenantIdHeaderOptional"
        - name: environment
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Environment"
      responses:
        "200":
          description: Estadísticas de envíos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EcfStatsResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /{environment}/ecf/responses/history:
    get:
      tags: [eCF Submission]
      summary: Historial de envíos (paginado)
      operationId: getEcfSubmissionHistory
      security:
        - oauth2: [documents:read]
