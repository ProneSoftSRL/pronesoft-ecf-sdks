openapi: 3.0.0

# =============================================================================
# eCF-Pronesoft Master Integration API — v1.1.0
# =============================================================================
# Authentication: OAuth 2.0 Client Credentials
#
# PORTALS (get credentials here):
#   Sandbox:    https://ecf.sandbox.pronesoft.com
#   Production: https://ecf.pronesoft.com
#
# API ENDPOINTS:
#   Sandbox:    https://api.ecf.sandbox.pronesoft.com/api/v1
#   Production: https://api.ecf.pronesoft.com/api/v1
#
# TOKEN LIFETIME: 86400 seconds (24 hours)
# =============================================================================

info:
  title: eCF-Pronesoft Integration API
  version: 1.2.0
  description: |
    ## Descripción general
    API de nivel productivo para emitir Comprobantes Fiscales Electrónicos (e-CF) en la
    República Dominicana a través de la plataforma Pronesoft.

    ## Autenticación — OAuth 2.0 Client Credentials

    ### Pasos
    1. Obtén tus credenciales desde el portal:
       - Sandbox: https://ecf.sandbox.pronesoft.com → Apps → Default Sandbox App
       - Producción: https://ecf.pronesoft.com → Integraciones → Apps → Crear App
    2. Solicita un token via POST /oauth/token — válido por 24 horas (86400s).
    3. Usa: Authorization: Bearer <accessToken> en cada request.
    4. Renueva al recibir HTTP 401. Buena práctica: renovar 5 minutos antes del vencimiento.

    ### Delegación multi-empresa
    Para actuar en nombre de una empresa asociada (sucursal), agrega:
      x-tenant-id: <business-uuid>
    NO envíes x-tenant-id cuando actúes como la empresa principal.

    ### Detalles del Sandbox
    - Usa cualquier RNC que comience con SBX (ej. SBX123456) — no se requiere certificado real.
    - Las secuencias son automáticas — no es necesario crearlas manualmente.
    - El campo environment en el cuerpo del documento DEBE ser TesteCF.

    ### Scopes disponibles
    business:read, business:create, business:update,
    members:read, members:invite, members:revoke,
    certificates:read, certificates:upload, certificates:update,
    documents:read, documents:create, documents:send, documents:receive, documents:update,
    approvals:read, approvals:commercial,
    sequences:read, sequences:create, sequences:update, sequences:cancel,
    business_info:read, certification:read, certification:write, reports:read

  contact:
    name: Pronesoft SRL Support
    url: https://pronesoft.com
    email: support@pronesoft.com
  license:
    name: Proprietary
    url: https://pronesoft.com/terms

externalDocs:
  description: Pronesoft eCF SDKs Repository
  url: https://github.com/ProneSoftSRL/pronesoft-ecf-sdks

servers:
  - url: https://api.ecf.sandbox.pronesoft.com/api/v1
    description: Sandbox — desarrollo y pruebas
  - url: https://api.ecf.pronesoft.com/api/v1
    description: Producción — emisión real de e-CF

security:
  - oauth2: []

tags:
  - name: Authentication
    description: Endpoint de token OAuth 2.0. No requiere cabecera de autorización. Los tokens son válidos por 24 horas.
  - name: Digital Certificates
    description: Sube y gestiona los certificados digitales de firma emitidos por DGII (formato P12/PFX).
  - name: Tax Sequences
    description: Gestiona los rangos de números de comprobante fiscal e-NCF (E31-E47). Automático en Sandbox.
  - name: eCF Submission
    description: Endpoint principal para enviar documentos e-CF a la DGII a través de Pronesoft.
  - name: Documents Sent
    description: Consulta, descarga y obtén estadísticas de los documentos enviados.
  - name: Documents Received
    description: Gestiona y consulta los documentos e-CF recibidos de terceros.
  - name: Commercial Approvals
    description: Gestiona el flujo interno de aprobación comercial de documentos recibidos.
  - name: Associated Companies
    description: Gestiona sucursales y empresas asociadas bajo tu cuenta principal.
  - name: Webhook Configuration
    description: Consulta las configuraciones de webhooks (los webhooks se crean desde el Portal).
  - name: Automated Certification
    description: Automatiza el proceso de certificación con la DGII para ERPs.
  - name: Reports
    description: Descarga reportes contables (Documentos Enviados, Formato 606) para cumplimiento DGII.

paths:
  /oauth/token:
    post:
      tags: [Authentication]
      summary: Obtener token de acceso (OAuth 2.0)
      description: |
        Autenticación mediante el flujo OAuth 2.0 Client Credentials.
        Retorna un token Bearer válido por 24 horas (86400 segundos).
        Este endpoint es público — no requiere cabecera de Authorization.
      operationId: getAccessToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthTokenRequest"
            example:
              clientId: "app_live_TU_CLIENT_ID"
              clientSecret: "sk_live_TU_CLIENT_SECRET"
      responses:
        "200":
          description: Token generado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenResponse"
              example:
                accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                tokenType: "Bearer"
                expiresIn: 86400
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /{rnc}/certificates:
    post:
      tags: [Digital Certificates]
      summary: Subir certificado digital (P12/PFX)
      description: |
        Sube el certificado de firma digital emitido por DGII para una empresa.
        Se almacena cifrado con AES-256-CBC. No existe endpoint de descarga.
        Tip Sandbox: Los RNC con prefijo SBX no requieren certificado.
      operationId: uploadCertificate
      security:
        - oauth2: [certificates:upload]
      parameters:
        - $ref: "#/components/parameters/RncPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, password]
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo del certificado en formato .p12 o .pfx.
                password:
                  type: string
                  format: password
                  description: Contraseña para desbloquear el certificado.
      responses:
        "201":
          description: Certificado subido exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadCertificateResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: RNC de la empresa no encontrado en el sistema.

  /tax-sequences:
    get:
      tags: [Tax Sequences]
      summary: Listar secuencias de NCF
      operationId: listTaxSequences
      security:
        - oauth2: [sequences:read]
      parameters:
        - $ref: "#/components/parameters/TenantIdHeaderOptional"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/InvoiceTypeSequence"
        - name: environment
          in: query
          schema:
            $ref: "#/components/schemas/Environment"
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: Lista de secuencias de NCF
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TaxSequence"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /tax-sequences/create:
    post:
      tags: [Tax Sequences]
      summary: Crear nueva secuencia de NCF
      operationId: createTaxSequence
      security:
        - oauth2: [sequences:create]
      parameters:
        - $ref: "#/components/parameters/TenantIdHeaderOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaxSequenceRequest"
            example:
              type: "E32"
              from: 1
              to: 10000
              quantity: 10000
              expiration: "2025-12-31"
              environment: "TesteCF"
      responses:
        "201":
          description: Secuencia creada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: "#/components/schemas/TaxSequenceCreated"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /tax-sequences/next:
    get:
      tags: [Tax Sequences]
      summary: Obtener siguiente número fiscal disponible
      description: Retorna el siguiente número e-NCF disponible. Úsalo como invoiceNumber al enviar.
      operationId: getNextNumber
      security:
        - oauth2: [sequences:read]
      parameters:
        - $ref: "#/components/parameters/TenantIdHeaderOptional"
        - name: type
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/InvoiceTypeSequence"
        - name: environment
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Environment"
      responses:
        "200":
          description: Siguiente número e-NCF disponible
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      nextNumber:
                        type: string
                        example: "E32000005251"
                      sequenceId:
                        type: string
                        example: "seq_live_1234567890"
                      remainingNumbers:
                        type: integer
                        example: 4750
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /tax-sequences/update:
    patch:
      tags: [Tax Sequences]
      summary: Actualizar secuencia de NCF
      operationId: updateTaxSequence
      security:
        - oauth2: [sequences:update]
      parameters:
        - $ref: "#/components/parameters/TenantIdHeaderOptional"
        - name: id
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaxSequenceRequest"
      responses:
        "200":
          description: Secuencia actualizada exitosamente
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /tax-sequences/void:
    post:
      tags: [Tax Sequences]
      summary: Anular rango de números fiscales
      description: Cancela números fiscales no utilizados y notifica a la DGII.
      operationId: voidTaxSequence
      security:
        - oauth2: [sequences:cancel]
      parameters:
        - $ref: "#/components/parameters/TenantIdHeaderOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidTaxSequenceRequest"
      responses:
        "200":
          description: Números anulados exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      sequenceId: { type: string }
                      voidedNumbers: { type: integer }
                      status: { type: string, example: "SENT_TO_DGII" }
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /{environment}/ecf/submit:
    post:
      tags: [eCF Submission]
      summary: Enviar documento e-CF a la DGII
      description: |
        Envía un comprobante fiscal electrónico. Maneja automáticamente la firma XML,
        la cola de envío, el modo contingencia y la comunicación con la DGII.
        IMPORTANTE: En Sandbox el campo environment en el cuerpo DEBE ser TesteCF.
      operationId: submitEcf
      security:
        - oauth2: [documents:send]
      parameters:
        - $ref: "#/components/parameters/TenantIdHeaderOptional"
        - name: environment
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Environment"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElectronicDocument"
