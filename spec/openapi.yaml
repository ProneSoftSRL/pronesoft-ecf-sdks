        Other headers: X-Webhook-Event, X-Webhook-ID, X-Webhook-Timestamp.
      required: [id, event, timestamp, businessRnc, data]
      properties:
        id:
          type: string
          description: Unique notification ID (evt_xxx format). Use for deduplication.
          example: "evt_1234567890abcdef"
        event:
          $ref: "#/components/schemas/WebhookEventType"
        timestamp:
          type: string
          format: date-time
        businessRnc:
          type: string
        data:
          type: object

