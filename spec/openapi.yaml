        limit: { type: integer }
        totalPages: { type: integer }

    Subtotal:
      type: object
      properties:
        number: { type: integer }
        description: { type: string }
        order: { type: integer }
        taxableAmount: { type: number }
        taxableAmount1: { type: number }
        taxableAmount2: { type: number }
        taxableAmount3: { type: number }
        totalITBIS: { type: number }
        itbis1: { type: number }
        itbis2: { type: number }
        itbis3: { type: number }
        additionalTaxes: { type: number }
        exemptAmount: { type: number }
        amount: { type: number }
        lines: { type: integer }

    DiscountOrSurcharge:
      type: object
      required: [lineNumber, type, valueType, amount]
      properties:
        lineNumber: { type: integer }
        type:
          type: string
          enum: ["D", "R"]
          description: "D=Discount, R=Surcharge"
        norm1007Indicator:
          type: string
          enum: ["0", "1"]
        description: { type: string }
        valueType:
          type: string
          enum: ["$", "%"]
        percentageValue: { type: number }
        amount: { type: number }
        alternativeCurrencyAmount: { type: number }
        billingIndicator: { $ref: "#/components/schemas/BillingIndicator" }

    Page:
      type: object
      properties:
        pageNumber: { type: integer }
        lineFrom: { type: integer }
        lineTo: { type: integer }
        taxableAmount: { type: number }
        taxableAmount1: { type: number }
        taxableAmount2: { type: number }
        taxableAmount3: { type: number }
        exemptAmount: { type: number }
        totalITBIS: { type: number }
        itbis1: { type: number }
        itbis2: { type: number }
        itbis3: { type: number }
        additionalTaxes: { type: number }
        subtotal: { type: number }
        nonBillableAmount: { type: number }

    Transport:
      type: object
      properties:
        driver: { type: string }
        document: { type: string }
        vehicleId: { type: string }
        licensePlate: { type: string }
        route: { type: string }
        zone: { type: string }
        deliveryNoteNumber: { type: string }
        destinationCountry: { type: string }

    AdditionalInfo:
      type: object
      properties:
        shipmentDate: { type: string }
        shipmentNumber: { type: string }
        containerNumber: { type: string }
        referenceNumber: { type: string }
        grossWeight: { type: number }
        netWeight: { type: number }
        grossWeightUnit: { type: integer }
        netWeightUnit: { type: integer }
        packageQuantity: { type: number }
        packageUnit: { type: integer }
        packageVolume: { type: number }
        volumeUnit: { type: integer }

    AlternativeCurrency:
      type: object
      required: [code, exchangeRate]
      properties:
        code: { type: string, maxLength: 3, example: "USD" }
        exchangeRate: { type: number, example: 58.50 }
        taxableAmount: { type: number }
        taxableAmount1: { type: number }
        taxableAmount2: { type: number }
        taxableAmount3: { type: number }
        exemptAmount: { type: number }
        totalITBIS: { type: number }
        itbis1: { type: number }
        itbis2: { type: number }
        itbis3: { type: number }
        additionalTaxAmount: { type: number }
        additionalTaxes:
          type: array
          items: { type: string }
        nonBillableAmount: { type: number }
        totalAmount: { type: number }

    ReferenceInfo:
      type: object
      required: [modifiedInvoiceNumber, modificationCode]
      description: Reference to previously issued document (for credit/debit notes).
      properties:
        modifiedInvoiceNumber: { type: string, example: "E310000000001" }
        otherContributorRNC: { type: string }
        modifiedInvoiceDate: { type: string, format: date-time }
        modificationCode:
          type: string
          enum: ["1", "2", "3", "4", "5"]
          description: "1=Price, 2=Quantity, 3=Return, 4=Tax, 5=Other"
        modificationReason: { type: string }

    ItemAdditionalTax:
      type: object
      required: [code]
      properties:
        code: { type: string, description: "DGII tax code (e.g. ISC, IECS)" }
        amount: { oneOf: [{ type: number }, { type: string }] }
        rate: { type: number }
        alternativeCurrencyAmount: { type: number }

    AdditionalTax:
      type: object
      required: [code, rate]
      properties:
        code: { type: string, maxLength: 3 }
        rate: { type: number }
        specificConsumptionTaxAmount: { type: number }
        adValoremConsumptionTaxAmount: { type: number }
        otherAdditionalTaxesAmount: { type: number }

    DgiiMessage:
      type: object
      properties:
        codigo: { type: number }
        valor: { type: string }

    Subquantity:
      type: object
      required: [quantity, unitCode]
      properties:
        quantity: { type: number }
        unitCode: { type: integer }

    ErrorResponse:
      type: object
      properties:
        statusCode: { type: integer }
        message: { type: string }
        error: { type: string }
        timestamp: { type: string, format: date-time }

    RateLimitErrorResponse:
      type: object
      properties:
        statusCode: { type: integer, example: 429 }
        message: { type: string, example: "Rate limit exceeded. Retry after 1 second." }
        error: { type: string, example: "Too Many Requests" }
        retryAfter: { type: integer, example: 1 }
