                  invoiceType: "31"
                  issueDate: "2025-06-04"
                  paymentType: "1"
                  incomeType: "01"
                  taxedAmountIndicator: "0"
                  issuerRNC: "133190907"
                  issuerBusinessName: "Mi Empresa SRL"
                  issuerAddress: "Av. Winston Churchill 1099, Santo Domingo"
                  buyer:
                    taxId: "101234567"
                    name: "Cliente Corporativo SRL"
                  items:
                    - name: "Servicio de desarrollo de software"
                      quantity: 1
                      unitPrice: "50000.00"
                      unitOfMeasure: 1
                      type: "2"
                      billingIndicator: "1"
                  totals:
                    taxableAmount: 50000.00
                    exemptAmount: 0
                    totalITBIS: 9000.00
                    totalAmount: 59000.00
                  paymentForms:
                    - method: "1"
                      amount: 59000.00

              tipo32_consumo:
                summary: "Tipo 32 — Factura de Consumo"
                description: Para ventas al consumidor final. Comprador opcional si el total es menor a RD$250,000.
                value:
                  invoiceType: "32"
                  issueDate: "2025-06-04"
                  paymentType: "1"
                  incomeType: "01"
                  taxedAmountIndicator: "0"
                  issuerRNC: "133190907"
                  issuerBusinessName: "Mi Empresa SRL"
                  issuerAddress: "Av. Winston Churchill 1099, Santo Domingo"
                  buyer:
                    name: "Consumidor Final"
                  items:
                    - name: "Producto electrónico"
                      quantity: 2
                      unitPrice: "5500.00"
                      unitOfMeasure: 1
                      type: "1"
                      billingIndicator: "1"
                  totals:
                    taxableAmount: 11000.00
                    exemptAmount: 0
                    totalITBIS: 1980.00
                    totalAmount: 12980.00
                  paymentForms:
                    - method: "1"
                      amount: 12980.00

              tipo33_nota_debito:
                summary: "Tipo 33 — Nota de Débito"
                description: Aumenta el valor de una factura previamente emitida. Requiere referenceInfo.
                value:
                  invoiceType: "33"
                  issueDate: "2025-06-04"
                  paymentType: "1"
                  incomeType: "01"
                  taxedAmountIndicator: "0"
                  issuerRNC: "133190907"
                  issuerBusinessName: "Mi Empresa SRL"
                  issuerAddress: "Av. Winston Churchill 1099, Santo Domingo"
                  referenceInfo:
                    modifiedInvoiceNumber: "E310000000001"
                    modifiedInvoiceDate: "2025-05-20"
                    modificationCode: "3"
                  buyer:
