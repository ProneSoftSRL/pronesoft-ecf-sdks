paths:
  /oauth/token:
    post:
      description: |
        Autenticación mediante el flujo OAuth 2.0 Client Credentials.
        Retorna un token Bearer válido por 24 horas (86400 segundos).
        Este endpoint es público — no requiere cabecera de Authorization.
      operationId: getAccessToken
      requestBody:
        content:
          application/json:
            example:
              clientId: app_live_TU_CLIENT_ID
              clientSecret: sk_live_TU_CLIENT_SECRET
            schema:
              $ref: "#/components/schemas/OAuthTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                tokenType: Bearer
                expiresIn: 86400
              schema:
                $ref: "#/components/schemas/OAuthTokenResponse"
          description: Token generado exitosamente
        "401":
          content:
            application/json:
              example:
                statusCode: 401
                message: Invalid client credentials
                error: Unauthorized
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Token ausente, expirado o inválido. Llama a POST /oauth/token\
            \ para renovarlo."
      security: []
      summary: Obtener token de acceso (OAuth 2.0)
      tags:
      - Authentication
  /{rnc}/certificates:
    post:
      description: |
        Sube el certificado de firma digital emitido por DGII para una empresa.
        Se almacena cifrado con AES-256-CBC. No existe endpoint de descarga.
        Tip Sandbox: Los RNC con prefijo SBX no requieren certificado.
      operationId: uploadCertificate
      parameters:
      - description: RNC de la empresa (9 u 11 dígitos). En Sandbox usar valores con
          prefijo SBX.
        explode: false
        in: path
        name: rnc
        required: true
        schema:
          example: "133190907"
          type: string
        style: simple
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/uploadCertificate_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadCertificateResponse"
          description: Certificado subido exitosamente
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Error de validación (400). Revisa el campo message para más
            detalles.
        "401":
          content:
            application/json:
              example:
                statusCode: 401
                message: Invalid client credentials
                error: Unauthorized
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Token ausente, expirado o inválido. Llama a POST /oauth/token\
            \ para renovarlo."
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The token does not have the required scope.
        "404":
          description: RNC de la empresa no encontrado en el sistema.
      security:
      - oauth2:
        - certificates:upload
      summary: Subir certificado digital (P12/PFX)
      tags:
      - Digital Certificates
  /tax-sequences:
    get:
      operationId: listTaxSequences
      parameters:
      - description: |
          UUID de la empresa asociada (sucursal). Incluir SOLO cuando se actúa
          en nombre de una sucursal. Omitir cuando se actúa como empresa principal.
        explode: false
        in: header
        name: x-tenant-id
        required: false
        schema:
          example: 468a4aa1-1b80-447e-9ecb-400e39f7d798
          format: uuid
          type: string
        style: simple
      - explode: true
        in: query
        name: type
        required: false
        schema:
          $ref: "#/components/schemas/InvoiceTypeSequence"
        style: form
      - explode: true
        in: query
        name: environment
        required: false
        schema:
          $ref: "#/components/schemas/Environment"
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 10
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listTaxSequences_200_response"
          description: Lista de secuencias de NCF
        "401":
          content:
            application/json:
              example:
                statusCode: 401
                message: Invalid client credentials
                error: Unauthorized
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Token ausente, expirado o inválido. Llama a POST /oauth/token\
            \ para renovarlo."
      security:
      - oauth2:
        - sequences:read
      summary: Listar secuencias de NCF
      tags:
      - Tax Sequences
