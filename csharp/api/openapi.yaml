components:
  parameters:
    TenantIdHeaderOptional:
      description: |
        UUID de la empresa asociada (sucursal). Incluir SOLO cuando se actúa
        en nombre de una sucursal. Omitir cuando se actúa como empresa principal.
      explode: false
      in: header
      name: x-tenant-id
      required: false
      schema:
        example: 468a4aa1-1b80-447e-9ecb-400e39f7d798
        format: uuid
        type: string
      style: simple
    RncPath:
      description: RNC de la empresa (9 u 11 dígitos). En Sandbox usar valores con
        prefijo SBX.
      explode: false
      in: path
      name: rnc
      required: true
      schema:
        example: "133190907"
        type: string
      style: simple
  responses:
    UnauthorizedError:
      content:
        application/json:
          example:
            statusCode: 401
            message: Invalid client credentials
            error: Unauthorized
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: "Token ausente, expirado o inválido. Llama a POST /oauth/token\
        \ para renovarlo."
    ValidationError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Error de validación (400). Revisa el campo message para más detalles.
    ForbiddenError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: The token does not have the required scope.
    RateLimitError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitErrorResponse"
      description: Rate limit exceeded. Retry after indicated seconds.
  schemas:
    Environment:
      description: "TesteCF=testing no DGII, CerteCF=official certification, eCF=production"
      enum:
      - TesteCF
      - CerteCF
      - eCF
      type: string
    InvoiceType:
      description: |
        31=Factura Credito Fiscal, 32=Factura Consumo, 33=Nota Debito,
        34=Nota Credito, 41=Compras, 43=Gastos Menores,
        44=Regimenes Especiales, 45=Gubernamental, 46=Exportaciones, 47=Pagos Exterior
      enum:
      - "31"
      - "32"
      - "33"
      - "34"
      - "41"
      - "43"
      - "44"
      - "45"
      - "46"
      - "47"
      type: string
    InvoiceTypeSequence:
      description: Invoice type with E prefix — used for tax sequence endpoints.
      enum:
      - E31
      - E32
      - E33
      - E34
      - E41
      - E43
      - E44
      - E45
      - E46
      - E47
      type: string
    PaymentMethod:
      description: "1=Cash, 2=Check, 3=Card, 4=Credit, 5=Transfer, 6=Electronic, 7=Bond,\
        \ 8=Other"
      enum:
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"
      - "6"
      - "7"
      - "8"
      type: string
    BillingIndicator:
      description: "0=Non-billable, 1=18% ITBIS, 2=16% ITBIS, 3=0% ITBIS, 4=Exempt"
      enum:
      - "0"
      - "1"
      - "2"
      - "3"
      - "4"
      type: string
    WebhookEventType:
      enum:
      - document.received
      - document.status_changed
      - document.validation_error
      - document.contingency_activated
      - commercial.approval
      - certificate.expiring
      - security.new_login
      - security.api_key_rotated
      - plan.usage_alert
      - plan.payment_failed
      - billing.invoice_ready
      - sequence.depleted
      - sequence.voided
      - branch.created
      - branch.status_changed
      - member.invited
      - member.joined
      - member.removed
      - certification.completed
      type: string
    PrintFormat:
      enum:
      - A4
      - thermal_80
      - thermal_58
      type: string
    AccountType:
      description: "CT=Current account, AH=Savings, OT=Other"
      enum:
      - CT
      - AH
      - OT
      type: string
    DocumentStatus:
      enum:
      - IN_PROCESS
      - APPROVED
      - CONDITIONALLY_APPROVED
      - REJECTED
      - ERROR
      - ERROR_COMUNICATION
      type: string
    PublicDocumentStatus:
      description: Lifecycle status visible to integrators.
      enum:
      - REGISTERED
      - TO_SEND
      - WAITING_RESPONSE
      - FINISHED
      type: string
    LegalStatus:
      description: Fiscal result from DGII. Only meaningful when PublicDocumentStatus=FINISHED.
      enum:
      - ACCEPTED
      - ACCEPTED_WITH_OBSERVATIONS
      - REJECTED
      - ERROR
      type: string
    OAuthTokenRequest:
      description: Credentials for OAuth 2.0. Get from Pronesoft portal.
      example:
        clientId: app_live_TU_CLIENT_ID
        clientSecret: sk_live_TU_CLIENT_SECRET
      properties:
        clientId:
          example: app_live_TU_CLIENT_ID
          type: string
        clientSecret:
          example: sk_live_TU_CLIENT_SECRET
          type: string
      required:
      - clientId
      - clientSecret
      type: object
    OAuthTokenResponse:
      description: Bearer token valid for 24 hours (86400 seconds).
      example:
        expiresIn: 86400
        scope:
        - documents:read
        - documents:write
        accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType: Bearer
      properties:
        accessToken:
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          type: string
        tokenType:
          example: Bearer
